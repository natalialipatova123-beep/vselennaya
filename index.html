<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {

html,body { width:100%;height:100%;overflow:hidden;background:var(--bg);

/* ── canvases ── */

}
.s1-sub {

/* ── orb wrapper ── */
.orb-wrap {
  position:relative;width:200px;height:200px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:36px;
}

/* arc SVG */
.arc-svg { position:absolute;inset:-8px;width:calc(100%+16px);height:calc(100%+16px);
  pointer-events:none;z-index:3; }

/* THE ORB */
.orb {
  width:170px;height:170px;border-radius:50%;
  cursor:pointer;user-select:none;
  position:relative;z-index:1;
  background:
    radial-gradient(circle at 32% 28%, rgba(155,111,200,.3) 0%, transparent 50%),
    radial-gradient(circle at 65% 70%, rgba(79,195,247,.15) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(30,15,50,1) 0%, rgba(8,8,14,1) 100%);
  border:1.5px solid rgba(155,111,200,.25);
  box-shadow:
    0 0 30px rgba(155,111,200,.12),
    0 0 60px rgba(79,195,247,.06),
    inset 0 0 40px rgba(155,111,200,.07),
    inset 0 0 80px rgba(79,195,247,.04);
  animation:orbBreath 5s ease-in-out infinite;
  transition:border-color .4s,box-shadow .4s;
}
/* glass highlight */
.orb::before {
  content:'';position:absolute;
  width:44%;height:28%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.16) 0%,transparent 70%);
  top:13%;left:18%;pointer-events:none;z-index:4;
}
/* rotating gradient ring */
.orb::after {
  content:'';position:absolute;inset:-1.5px;border-radius:50%;
  background:conic-gradient(from 0deg,
    rgba(155,111,200,.55),rgba(79,195,247,.35),
    rgba(201,168,76,.2),rgba(155,111,200,.55));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 1.5px),white calc(100% - 1.5px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 1.5px),white calc(100% - 1.5px));
  animation:orbRing 7s linear infinite;opacity:.7;
  transition:opacity .4s;
}
/* inner light core */
.orb-core {
  position:absolute;inset:25%;border-radius:50%;
  background:radial-gradient(circle,rgba(155,111,200,.25) 0%,rgba(79,195,247,.1) 50%,transparent 100%);
  animation:coreBreath 3.5s ease-in-out infinite;
  filter:blur(2px);
}
/* second inner shimmer */
.orb-shimmer {
  position:absolute;inset:35%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);
  animation:shimmerMove 4s ease-in-out infinite alternate;
}

@keyframes orbBreath {
  0%,100% { transform:scale(1); box-shadow:0 0 30px rgba(155,111,200,.12),0 0 60px rgba(79,195,247,.06),inset 0 0 40px rgba(155,111,200,.07); }
  50%      { transform:scale(1.03); box-shadow:0 0 50px rgba(155,111,200,.22),0 0 100px rgba(79,195,247,.1),inset 0 0 60px rgba(155,111,200,.12); }
}
@keyframes orbRing { to { transform:rotate(360deg); } }
@keyframes coreBreath {
  0%,100% { transform:scale(.85);opacity:.6; }
  50%     { transform:scale(1.15);opacity:1; }
}
@keyframes shimmerMove {
  from { transform:translate(-10%,-10%) scale(.9); opacity:.5; }
  to   { transform:translate(10%,10%) scale(1.1); opacity:.9; }
}

/* HOLDING STATE */
.orb.holding {
  border-color:rgba(155,111,200,.65) !important;
  animation:orbBreath 5s ease-in-out infinite, orbVibrate .08s linear infinite;
  box-shadow:
    0 0 60px rgba(155,111,200,.4),
    0 0 120px rgba(79,195,247,.18),
    0 0 180px rgba(155,111,200,.1),
    inset 0 0 60px rgba(155,111,200,.2) !important;
}
.orb.holding::after { opacity:1; }
@keyframes orbVibrate {
  0%   { transform:scale(1.03) translate(0,0); }
  20%  { transform:scale(1.03) translate(-1.2px,.8px); }
  40%  { transform:scale(1.03) translate(1.2px,-.8px); }
  60%  { transform:scale(1.03) translate(-1px,-1px); }
  80%  { transform:scale(1.03) translate(1px,1px); }
  100% { transform:scale(1.03) translate(0,0); }
}

/* hint */
.orb-hint {
  font-size:13px;color:var(--silver);opacity:.7;
  font-family:'Helvetica Neue',sans-serif;letter-spacing:.6px;
  transition:opacity .4s, color .4s;
  line-height:1.6;
}
.orb-hint.active { opacity:1;color:var(--violet-l); }

const bgCvs = document.getElementById('bgCvs');
const bgCtx = bgCvs.getContext('2d');

function resizeBg() { bgCvs.width=innerWidth; bgCvs.height=innerHeight; }
resizeBg(); window.addEventListener('resize', resizeBg);

class BgParticle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * bgCvs.width;
    this.y = Math.random() * bgCvs.height;
    this.r = Math.random() * 1.3 + .25;
    this.vx = (Math.random()-.5) * .18;
    this.vy = -Math.random() * .28 - .06;
    this.a = Math.random() * .3 + .04;
    this.l = 0; this.ml = Math.random() * 160 + 80;
    const cs = ['rgba(201,168,76,','rgba(155,111,200,','rgba(79,195,247,'];
    this.c = cs[~~(Math.random()*3)];
  }
  tick() {
    this.x += this.vx; this.y += this.vy; this.l++;
    if(this.l>this.ml || this.y<-6) this.reset();
  }
  draw() {
    const p = this.l/this.ml;
    const al = this.a*(p<.2?p/.2:p>.8?(1-p)/.2:1);
    bgCtx.beginPath(); bgCtx.arc(this.x,this.y,this.r,0,Math.PI*2);
    bgCtx.fillStyle = this.c+al+')'; bgCtx.fill();
  }
}

const bgPts = Array.from({length:65}, ()=>{ const p=new BgParticle(); p.l=Math.random()*p.ml; return p; });

function bgLoop() {
  bgCtx.clearRect(0,0,bgCvs.width,bgCvs.height);
  bgPts.forEach(p=>{ p.tick(); p.draw(); });
  requestAnimationFrame(bgLoop);
}
bgLoop();

/* ══════════════════════════════
   ORBITAL PARTICLES (around orb)
══════════════════════════════ */
const orbCvs = document.getElementById('orbCvs');
const orbCtx = orbCvs.getContext('2d');
let orbW = 0, orbH = 0, orbCX = 0, orbCY = 0;

function setupOrbCanvas() {
  const ow = orbCvs.parentElement;
  const r = ow.getBoundingClientRect();
  orbW = r.width + 60; orbH = r.height + 60;
  orbCvs.width = orbW; orbCvs.height = orbH;
  orbCX = orbW/2; orbCY = orbH/2;
}

class OrbParticle {
  constructor() { this.reset(); }
  reset() {
    this.angle = Math.random() * Math.PI*2;
    this.baseR = 62 + Math.random()*38;
    this.curR  = this.baseR;
    this.spd   = (Math.random()*.014+.006) * (Math.random()>.5?1:-1);
    this.sz    = Math.random()*2+.4;
    this.a     = Math.random()*.5+.08;
    this.yR    = .32+Math.random()*.28;   // elliptical y-squeeze
    const cs   = ['rgba(155,111,200,','rgba(79,195,247,','rgba(201,168,76,'];
    this.c     = cs[~~(Math.random()*3)];
    this.pulse = Math.random()*Math.PI*2; // random phase for size pulse
  }
  tick(spdMult, pull) {
    this.angle += this.spd * spdMult;
    const tR = this.baseR*(1 - pull*.45);
    this.curR += (tR - this.curR)*.06;
    this.x = orbCX + Math.cos(this.angle)*this.curR;
    this.y = orbCY + Math.sin(this.angle)*this.curR*this.yR;
    this.pulse += .04;
  }
  draw(pull) {
    const alpha = Math.min(this.a*(1+pull*.9), .92);
    const sz    = this.sz*(1+Math.sin(this.pulse)*.2)*(1+pull*.4);
    orbCtx.beginPath(); orbCtx.arc(this.x,this.y,sz,0,Math.PI*2);
    orbCtx.fillStyle = this.c+alpha+')'; orbCtx.fill();
  }
}

const OP_COUNT = 55;
let orbPts = [];
function initOrbParticles() {
  setupOrbCanvas();
  orbPts = Array.from({length:OP_COUNT}, ()=>new OrbParticle());
}

let holdProgress = 0; // 0..1

function orbLoop() {
  orbCtx.clearRect(0,0,orbW,orbH);
  const spdMult = 1 + holdProgress*3.5;
  orbPts.forEach(p=>{ p.tick(spdMult, holdProgress); p.draw(holdProgress); });

  // inner glow when holding
  if(holdProgress > 0) {
    const g = orbCtx.createRadialGradient(orbCX,orbCY,0,orbCX,orbCY,75);
    g.addColorStop(0, `rgba(155,111,200,${holdProgress*.18})`);
    g.addColorStop(1, 'rgba(155,111,200,0)');
    orbCtx.beginPath(); orbCtx.arc(orbCX,orbCY,75,0,Math.PI*2);
    orbCtx.fillStyle=g; orbCtx.fill();
  }

  requestAnimationFrame(orbLoop);
}

/* ══════════════════════════════
   HOLD MECHANIC
══════════════════════════════ */
const orbEl   = document.getElementById('orb');
const orbHint = document.getElementById('orbHint');
const arcFill = document.getElementById('arcFill');
const ARC = 628.3;

let holdTimer = null, holdStartTime = null, isHolding = false;

function holdStart(e) {
  if(e) e.preventDefault();
  if(isHolding) return;
  isHolding = true;
  holdStartTime = Date.now();
  orbEl.classList.add('holding');
  orbHint.classList.add('active');
  orbHint.textContent = 'не отпускай шар…';
  arcFill.style.opacity = '1';
  haptic('medium'); // start haptic

  let lastHapticAt = 0;
  holdTimer = setInterval(()=>{
    const el = Date.now() - holdStartTime;
    holdProgress = Math.min(el/3000, 1);
    arcFill.style.strokeDashoffset = ARC*(1-holdProgress);

    // periodic haptic pulses while holding
    if(el - lastHapticAt > 600) {
      haptic('light');
      lastHapticAt = el;
    }

    if(el >= 3000) {
      holdDone();
    }
  }, 30);
}

function holdStop() {
  if(!isHolding) return;
  isHolding = false;
  clearInterval(holdTimer); holdTimer = null;
  orbEl.classList.remove('holding');
  orbHint.classList.remove('active');
  orbHint.textContent = 'удерживайте шар, чтобы Вселенная ответила';
  arcFill.style.opacity = '0';
  arcFill.style.strokeDashoffset = ARC;
  holdProgress = 0;
}

function holdDone() {
  clearInterval(holdTimer); holdTimer = null;
  isHolding = false;
  orbEl.classList.remove('holding');
  arcFill.style.opacity = '0';
  arcFill.style.strokeDashoffset = ARC;
  holdProgress = 0;
  haptic('heavy'); // strong haptic = Вселенная ответила
  orbHint.classList.remove('active');

  const n = Math.floor(Math.random()*9)+1;
  doReveal(n);
}

/* ══════════════════════════════
   REVEAL — PARTICLE ANIMATION
══════════════════════════════ */
const rvCvs = document.getElementById('rvCvs');
const rvCtx  = rvCvs.getContext('2d');

function resizeRv() { rvCvs.width=innerWidth; rvCvs.height=innerHeight; }
resizeRv(); window.addEventListener('resize', resizeRv);

function revealParticles(onDone) {
  rvCvs.style.opacity = '1';
  const CX = rvCvs.width/2, CY = rvCvs.height/2;
  const COUNT = 140;
  const COLORS = ['rgba(201,168,76,','rgba(155,111,200,','rgba(79,195,247,','rgba(232,196,106,'];

  // phase 0: scatter → converge  (0..1100ms)
  // phase 1: hold/glow burst     (1100..1500ms)
  // phase 2: explode out         (1500..2000ms)
  // phase 3: fade                (2000..2300ms)

  const pts = Array.from({length:COUNT}, ()=>{
    const a = Math.random()*Math.PI*2;
    const d = 90 + Math.random()*Math.min(CX,CY)*.7;
    return {
      x: CX + Math.cos(a)*d, y: CY + Math.sin(a)*d,
      tx:CX+(Math.random()-.5)*16, ty:CY+(Math.random()-.5)*16,
      vx:0, vy:0,
      sz: Math.random()*2.8+.5,
      a: Math.random()*.7+.3,
      c: COLORS[~~(Math.random()*COLORS.length)],
      phase:0
    };
  });

  let t0 = null;

  function frame(t) {
    if(!t0) t0=t;
    const elapsed = t - t0;
    rvCtx.clearRect(0,0,rvCvs.width,rvCvs.height);

    if(elapsed < 1100) {
      // CONVERGE
      const pr = elapsed/1100;
      const ease = pr<.5?2*pr*pr:1-Math.pow(-2*pr+2,2)/2;
      pts.forEach(p=>{
        p.x += (p.tx-p.x)*.055;
        p.y += (p.ty-p.y)*.055;
        const al = p.a*(1-ease*.1);
        rvCtx.beginPath(); rvCtx.arc(p.x,p.y,p.sz*(1+ease*.5),0,Math.PI*2);
        rvCtx.fillStyle=p.c+al+')'; rvCtx.fill();
      });
      // growing center glow
      const gr = rvCtx.createRadialGradient(CX,CY,0,CX,CY,55+ease*80);
      gr.addColorStop(0,`rgba(201,168,76,${ease*.45})`);
      gr.addColorStop(.4,`rgba(155,111,200,${ease*.2})`);
      gr.addColorStop(1,'rgba(0,0,0,0)');
      rvCtx.beginPath(); rvCtx.arc(CX,CY,55+ease*80,0,Math.PI*2);
      rvCtx.fillStyle=gr; rvCtx.fill();
      requestAnimationFrame(frame);

    } else if(elapsed < 1500) {
      // HOLD / BURST INIT
      if(pts[0].phase===0){
        pts.forEach(p=>{
          const a2=Math.random()*Math.PI*2, sp=3+Math.random()*5;
          p.vx=Math.cos(a2)*sp; p.vy=Math.sin(a2)*sp;
          p.x=CX+(Math.random()-.5)*8; p.y=CY+(Math.random()-.5)*8;
          p.phase=1;
        });
      }
      // bright burst glow
      const gr2 = rvCtx.createRadialGradient(CX,CY,0,CX,CY,120);
      gr2.addColorStop(0,'rgba(232,196,106,.55)');
      gr2.addColorStop(.3,'rgba(201,168,76,.25)');
      gr2.addColorStop(1,'rgba(0,0,0,0)');
      rvCtx.beginPath(); rvCtx.arc(CX,CY,120,0,Math.PI*2);
      rvCtx.fillStyle=gr2; rvCtx.fill();
      requestAnimationFrame(frame);

    } else if(elapsed < 2200) {
      // EXPLODE
      const pr = (elapsed-1500)/700;
      pts.forEach(p=>{
        p.x+=p.vx; p.y+=p.vy; p.vx*=.93; p.vy*=.93;
        const al = p.a*(1-pr);
        if(al>0){
          rvCtx.beginPath(); rvCtx.arc(p.x,p.y,p.sz*(1+pr*.5),0,Math.PI*2);
          rvCtx.fillStyle=p.c+al+')'; rvCtx.fill();
        }
      });
      // expanding ring
      const rR = 20+pr*Math.min(CX,CY)*1.2;
      const gr3=rvCtx.createRadialGradient(CX,CY,rR*.65,CX,CY,rR);
      gr3.addColorStop(0,'rgba(201,168,76,0)');
      gr3.addColorStop(.5,`rgba(201,168,76,${.35*(1-pr)})`);
      gr3.addColorStop(1,'rgba(201,168,76,0)');
      rvCtx.beginPath(); rvCtx.arc(CX,CY,rR,0,Math.PI*2);
      rvCtx.fillStyle=gr3; rvCtx.fill();
      requestAnimationFrame(frame);

    } else {
      // DONE
      rvCvs.style.opacity='0';
      onDone();
    }
  }

  requestAnimationFrame(frame);
}

    return;
  }

  // Десктоп браузер — открыть ссылку
  window.open(shareUrl, '_blank');
}
